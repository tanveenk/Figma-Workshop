ght="400" fill="#2A1B2E" text-anchor="start" opacity="0.75">No team yet? Meet people and pitch ideas.</text><rect x="572" y="359" width="70" height="22" rx="11.0" fill="#FBE3CB"/><text x="607.0" y="373.5" font-family="DM Sans, sans-serif" font-size="10" font-weight="500" fill="#2A1B2E" text-anchor="middle" opacity="1">Teams</text><rect x="40" y="420" width="620" height="80" rx="16" fill="#FFF8EF" stroke="#F3D9BC" stroke-width="1"/><rect x="58" y="449" width="66" height="22" rx="11.0" fill="#F7B93E"/><text x="91.0" y="463.5" font-family="DM Sans, sans-serif" font-size="10" font-weight="700" fill="#2A1B2E" text-anchor="middle" opacity="1">11:30 AM</text><text x="142" y="455" font-family="Bricolage Grotesque, sans-serif" font-size="15" font-weight="700" fill="#2A1B2E" text-anchor="start" opacity="1">Hacking begins</text><text x="142" y="475" font-family="DM Sans, sans-serif" font-size="10.5" font-weight="400" fill="#2A1B2E" text-anchor="start" opacity="0.75">Start building. Mentors are around all day.</text><rect x="572" y="449" width="70" height="22" rx="11.0" fill="#C9DCC5"/><text x="607.0" y="463.5" font-family="DM Sans, sans-serif" font-size="10" font-weight="500" fill="#2A1B2E" text-anchor="middle" opacity="1">Hack</text><rect x="40" y="510" width="620" height="80" rx="16" fill="#FFF8EF" stroke="#F3D9BC" stroke-width="1"/><rect x="58" y="539" width="66" height="22" rx="11.0" fill="#F7B93E"/><text x="91.0" y="553.5" font-family="DM Sans, sans-serif" font-size="10" font-weight="700" fill="#2A1B2E" text-anchor="middle" opacity="1">12:30 PM</text><text x="142" y="545" font-family="Bricolage Grotesque, sans-serif" font-size="15" font-weight="700" fill="#2A1B2E" text-anchor="start" opacity="1">Lunch</text><text x="142" y="565" font-family="DM Sans, sans-serif" font-size="10.5" font-weight="400" fill="#2A1B2E" text-anchor="start" opacity="0.75">Refuel and chat with our sponsors.</text><rect x="572" y="539" width="70" height="22" rx="11.0" fill="#FBE3CB"/><text x="607.0" 