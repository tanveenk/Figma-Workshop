nd mentors</text><circle cx="468" cy="314" r="8" fill="#E8A9A3"/><text x="486" y="318" font-family="DM Sans, sans-serif" font-size="12" font-weight="400" fill="#FFF8EF" text-anchor="start" opacity="1">Prizes and swag</text><circle cx="468" cy="358" r="8" fill="#A8C5A0"/><text x="486" y="362" font-family="DM Sans, sans-serif" font-size="12" font-weight="400" fill="#FFF8EF" text-anchor="start" opacity="1">Time with sponsors</text><rect x="440" y="420" width="220" height="160" rx="18" fill="#C9DCC5"/><text x="460" y="454" font-family="Bricolage Grotesque, sans-serif" font-size="18" font-weight="700" fill="#2A1B2E" text-anchor="start" opacity="1">Event details</text><text x="460" y="484" font-family="DM Sans, sans-serif" font-size="12" font-weight="400" fill="#2A1B2E" text-anchor="start" opacity="1">Date: Nov 14, 2026</text><text x="460" y="506" font-family="DM Sans, sans-serif" font-size="12" font-weight="400" fill="#2A1B2E" text-anchor="start" opacity="1">Venue: SFU Burnaby</text><text x="460" y="528" font-family="DM Sans, sans-serif" font-size="12" font-weight="400" fill="#2A1B2E" text-anchor="start" opacity="1">Doors open: 9:00 AM</text><text x="460" y="560" font-family="DM Sans, sans-serif" font-size="10" font-weight="400" fill="#2A1B2E" text-anchor="start" opacity="0.6">Sample details. Swap in yours.</text><text x="40" y="1182" font-family="DM Sans, sans-serif" font-size="10.5" font-weight="400" fill="#2A1B2E" text-anchor="start" opacity="0.65">WiCS · Fall Hacks 2026</text><text x="660" y="1182" font-family="DM Sans, sans-serif" font-size="10.5" font-weight="400" fill="#2A1B2E" text-anchor="end" opacity="0.65">Hosted by CSSS</text></svg>